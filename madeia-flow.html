.screen.panel.active{transform:translateX(0)}

.nav-item:active{background:#f7f8fc}

.nav-item.active .nav-label{background:linear-gradient(135deg,#833ab4,#e1306c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}

.nav-item.active .nav-dot{background:linear-gradient(135deg,#833ab4,#e1306c)}
/* ── PANEL CONTENT CSS ── */

/* ── RESET & BASE ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:#f7f8fc;color:#1a1a2e}
button{cursor:pointer;font-family:inherit;border:none;background:none}
a{text-decoration:none;color:inherit}

/* ── APP SHELL ── */
#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  background:#f7f8fc;
  overflow:hidden;
  max-width:480px;
  margin:0 auto;
  box-shadow:0 0 60px rgba(0,0,0,.12);
}

/* ── TOP BAR ── */
#topbar{
  flex-shrink:0;
  height:60px;
  background:#fff;
  border-bottom:1px solid #eef0f6;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  position:relative;
  z-index:50;
}
.topbar-logo{
  font-family:'Outfit',sans-serif;
  font-weight:900;font-size:1.25rem;
  color:#1a1a2e;letter-spacing:-.5px;
}
.topbar-logo span{
  background:linear-gradient(135deg,#833ab4,#e1306c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.topbar-title{
  font-weight:700;font-size:.95rem;
  color:#1a1a2e;
  position:absolute;left:50%;transform:translateX(-50%);
  white-space:nowrap;
}
.topbar-back{
  width:36px;height:36px;
  background:#f7f8fc;border-radius:50%;
  display:none;align-items:center;justify-content:center;
  font-size:1rem;color:#1a1a2e;
  transition:all .15s;
  border:1px solid #eef0f6;
}
.topbar-back:active{background:#eef0f6;transform:scale(.93)}
.topbar-action{
  background:linear-gradient(135deg,#833ab4,#e1306c);
  color:#fff;border-radius:50px;
  padding:7px 16px;font-size:.72rem;font-weight:700;
  transition:all .15s;
  white-space:nowrap;
}
.topbar-action:active{opacity:.85;transform:scale(.96)}

/* ── SCREEN CONTAINER ── */
#screens{
  flex:1;
  position:relative;
  overflow:hidden;
}

/* ── INDIVIDUAL SCREENS ── */
.screen{
  position:absolute;inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:#f7f8fc;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.screen.home{transform:translateX(0)}
.screen.panel{transform:translateX(100%)}
.screen.panel.active{transform:translateX(0)}
.screen.panel.exit{transform:translateX(100%)}

/* ── HOME SCREEN ── */
#home-screen{padding:20px 16px 20px}

.home-greeting{
  margin-bottom:20px;
}
.home-greeting h1{
  font-size:1.6rem;font-weight:900;
  color:#1a1a2e;letter-spacing:-.5px;
  line-height:1.1;
  margin-bottom:4px;
}
.home-greeting h1 span{
  background:linear-gradient(135deg,#833ab4,#e1306c,#fd7b33);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.home-greeting p{
  font-size:.85rem;color:#718096;font-weight:500;
}

/* quick stats strip */
.stats-strip{
  display:flex;gap:10px;
  margin-bottom:24px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding-bottom:2px;
}
.stats-strip::-webkit-scrollbar{display:none}
.stat-chip{
  flex-shrink:0;
  background:#fff;border:1px solid #eef0f6;
  border-radius:14px;padding:10px 16px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.stat-chip-icon{font-size:1rem}
.stat-chip-num{font-size:.95rem;font-weight:800;color:#1a1a2e}
.stat-chip-label{font-size:.65rem;color:#718096;font-weight:500}

/* section label */
.section-label{
  font-size:.68rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;
  color:#a0aec0;margin-bottom:12px;
}

/* ── TAB GRID ── */
.tab-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-bottom:12px;
}

.tab-tile{
  position:relative;
  border-radius:20px;
  padding:20px 16px 48px;
  cursor:pointer;
  overflow:hidden;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
  min-height:140px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.tab-tile:active{transform:scale(.95);box-shadow:0 2px 10px rgba(0,0,0,.1)}

/* shine overlay */
.tab-tile::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(145deg,rgba(255,255,255,.18) 0%,transparent 55%);
  border-radius:inherit;pointer-events:none;
}

/* 4-color system */
.tc-purple{background:linear-gradient(145deg,#a855f7 0%,#6d28d9 100%)}
.tc-pink  {background:linear-gradient(145deg,#f43f8e 0%,#be123c 100%)}
.tc-orange{background:linear-gradient(145deg,#fb923c 0%,#c2410c 100%)}
.tc-blue  {background:linear-gradient(145deg,#38bdf8 0%,#1d4ed8 100%)}
.tc-brand {background:linear-gradient(135deg,#833ab4 0%,#e1306c 55%,#fd7b33 100%)}
.tc-dark  {background:linear-gradient(145deg,#312e81 0%,#1e1b4b 100%)}

.tile-icon{
  width:44px;height:44px;
  background:rgba(255,255,255,.22);
  border:1.5px solid rgba(255,255,255,.32);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;margin-bottom:12px;
}
.tile-name{
  font-size:1rem;font-weight:800;
  color:#fff;line-height:1.15;
  letter-spacing:-.2px;
  text-shadow:0 1px 6px rgba(0,0,0,.18);
  margin-bottom:4px;
}
.tile-desc{
  font-size:.68rem;color:rgba(255,255,255,.78);
  line-height:1.45;font-weight:500;
}
.tile-arrow{
  position:absolute;bottom:14px;right:14px;
  width:26px;height:26px;
  background:rgba(255,255,255,.22);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;color:#fff;font-weight:700;
}

/* members tile — full width */
.tab-tile.full-width{
  grid-column:1/-1;
  min-height:auto;
  padding:18px 20px;
  display:flex;align-items:center;gap:16px;
}
.tab-tile.full-width .tile-icon{margin-bottom:0;flex-shrink:0}
.tab-tile.full-width .tile-text{flex:1;min-width:0}
.tab-tile.full-width .tile-name{font-size:.95rem;margin-bottom:2px}
.tab-tile.full-width .tile-desc{font-size:.71rem}
.members-badge{
  flex-shrink:0;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:8px;
  padding:5px 12px;font-size:.65rem;font-weight:700;
  letter-spacing:.04em;white-space:nowrap;
}

/* ── BOTTOM NAV ── */
#bottom-nav{
  flex-shrink:0;
  height:64px;
  background:#fff;
  border-top:1px solid #eef0f6;
  display:flex;align-items:stretch;
  padding:0 8px;
  padding-bottom:env(safe-area-inset-bottom);
  position:relative;z-index:50;
}
.nav-item{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;
  border-radius:12px;
  transition:all .15s;
  padding:6px 4px;
  cursor:pointer;
}
.nav-item:active{background:#f7f8fc}
.nav-icon{font-size:1.2rem;line-height:1}
.nav-label{
  font-size:.6rem;font-weight:600;
  color:#a0aec0;letter-spacing:.02em;
}
.nav-item.active .nav-label{
  background:linear-gradient(135deg,#833ab4,#e1306c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-weight:700;
}
.nav-dot{
  width:4px;height:4px;border-radius:50%;
  background:transparent;
  transition:.15s;
}
.nav-item.active .nav-dot{
  background:linear-gradient(135deg,#833ab4,#e1306c);
}

/* ── PANEL SCREEN ── */
#panel-screen{background:#f7f8fc}
.panel-content{padding:16px 16px 32px}

/* panel banner */
.panel-banner{
  border-radius:20px;padding:32px 24px;
  margin-bottom:20px;
  text-align:center;
  position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.12);
}
.panel-banner::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(145deg,rgba(255,255,255,.15) 0%,transparent 55%);
  pointer-events:none;
}
.panel-banner h2{
  font-size:1.5rem;font-weight:900;
  color:#fff;margin-bottom:6px;
  letter-spacing:-.4px;
  text-shadow:0 2px 8px rgba(0,0,0,.15);
}
.panel-banner p{
  font-size:.82rem;color:rgba(255,255,255,.82);
  max-width:340px;margin:0 auto;line-height:1.55;
}

/* content elements */
.sec-tag{
  display:inline-block;
  background:linear-gradient(135deg,rgba(131,58,180,.1),rgba(225,48,108,.1));
  border:1px solid rgba(225,48,108,.18);
  color:#e1306c;font-size:.62rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:4px 12px;border-radius:50px;margin-bottom:8px;
}
.sec-h{
  font-size:1.05rem;font-weight:800;
  color:#1a1a2e;margin-bottom:14px;letter-spacing:-.3px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;margin-bottom:22px;
}
.c-card{
  background:#fff;border:1.5px solid #eef0f6;
  border-radius:14px;padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  transition:.18s;
}
.c-card:active{transform:scale(.97)}
.c-card-icon{font-size:1.3rem;margin-bottom:8px}
.c-card h3{font-size:.82rem;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.c-card p{font-size:.73rem;color:#718096;line-height:1.55}
.c-badge{
  display:inline-block;margin-top:8px;
  background:linear-gradient(135deg,#d1fae5,#a7f3d0);
  color:#065f46;font-size:.6rem;font-weight:700;
  padding:2px 8px;border-radius:50px;border:1px solid #6ee7b7;
}
.acc-wrap{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
.acc{background:#fff;border:1.5px solid #eef0f6;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.acc-h{
  padding:14px 18px;display:flex;align-items:center;
  justify-content:space-between;
  font-size:.84rem;font-weight:700;color:#1a1a2e;cursor:pointer;
}
.acc-arr{color:#e1306c;transition:transform .28s;font-size:.72rem}
.acc-h.open .acc-arr{transform:rotate(180deg)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .32s ease}
.acc-b.open{max-height:600px}
.acc-inner{
  padding:0 18px 16px;font-size:.79rem;
  color:#718096;line-height:1.72;
  border-top:1px solid #eef0f6;
}
.acc-inner strong{color:#1a1a2e}
.step{
  display:flex;gap:12px;align-items:flex-start;
  background:#fff;border:1.5px solid #eef0f6;
  border-radius:14px;padding:14px 16px;margin-bottom:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.step-num{
  width:28px;height:28px;flex-shrink:0;
  background:linear-gradient(135deg,#833ab4,#e1306c);
  color:#fff;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:800;
}
.step-body h4{font-size:.82rem;font-weight:700;color:#1a1a2e;margin-bottom:2px}
.step-body p{font-size:.74rem;color:#718096;line-height:1.5}
.hook{
  background:#fff;border:1.5px solid #eef0f6;
  border-radius:14px;padding:13px 16px;margin-bottom:7px;
  position:relative;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  transition:.15s;
}
.hook:active{transform:scale(.98);background:#fafbff}
.hook-type{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e1306c;margin-bottom:3px}
.hook p{font-size:.77rem;color:#4a5568;line-height:1.5;font-style:italic;padding-right:44px}
.hook-copy{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:linear-gradient(135deg,#833ab4,#e1306c);
  border:none;border-radius:7px;padding:4px 10px;
  font-size:.6rem;font-weight:700;color:#fff;
  opacity:0;transition:.15s;cursor:pointer;
}
.hook:hover .hook-copy{opacity:1}
.story-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:9px;margin-bottom:20px;
}
.story-c{background:#fff;border:1.5px solid #eef0f6;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.story-num{font-size:.56rem;font-weight:800;color:#e1306c;letter-spacing:.08em;margin-bottom:4px}
.story-c h4{font-size:.8rem;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.story-c p{font-size:.72rem;color:#718096;line-height:1.5;font-style:italic}
.plan-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;margin-bottom:20px}
.plan-c{background:#fff;border:1.5px solid #eef0f6;border-radius:14px;padding:18px 14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.plan-num{
  font-size:2rem;font-weight:900;line-height:1;margin-bottom:3px;
  background:linear-gradient(135deg,#833ab4,#e1306c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.plan-lbl{font-size:.67rem;color:#718096;margin-bottom:5px;font-weight:600}
.plan-badge{display:inline-block;background:linear-gradient(135deg,rgba(131,58,180,.1),rgba(225,48,108,.1));border:1px solid rgba(225,48,108,.18);color:#e1306c;font-size:.6rem;font-weight:700;padding:2px 9px;border-radius:50px}
.plan-c p{font-size:.7rem;color:#718096;margin-top:7px;line-height:1.5}
.tip{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1.5px solid #eef0f6;border-radius:14px;padding:16px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.tip-num{
  font-size:1.5rem;font-weight:900;min-width:28px;line-height:1;
  background:linear-gradient(135deg,#833ab4,#e1306c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.tip-b h3{font-size:.85rem;font-weight:700;color:#1a1a2e;margin-bottom:2px}
.tip-b p{font-size:.75rem;color:#718096;line-height:1.58}
.t-badge{display:inline-block;margin-top:5px;font-size:.6rem;font-weight:700;padding:2px 9px;border-radius:50px}
.tb-blue{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe}
.tb-green{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.tb-gold{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.gen-box{background:#fff;border:1.5px solid #eef0f6;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.gen-label{font-size:.75rem;font-weight:600;color:#718096;margin-bottom:10px}
.gen-row{display:flex;gap:8px;flex-wrap:wrap}
.gen-select{flex:1;min-width:120px;padding:9px 12px;border:1.5px solid #eef0f6;border-radius:10px;background:#f7f8fc;color:#1a1a2e;font-family:'Outfit',sans-serif;font-size:.8rem;outline:none}
.gen-btn{background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-family:'Outfit',sans-serif;font-size:.8rem;font-weight:700;box-shadow:0 4px 14px rgba(131,58,180,.3);transition:.15s}
.gen-btn:active{transform:scale(.96)}
.gen-btn:disabled{opacity:.4;cursor:not-allowed}
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
.idea-c{background:linear-gradient(135deg,rgba(131,58,180,.06),rgba(225,48,108,.06));border:1.5px solid rgba(225,48,108,.13);border-radius:14px;padding:13px}
.idea-n{font-size:.58rem;font-weight:800;color:#e1306c;letter-spacing:.06em;margin-bottom:3px}
.idea-c p{font-size:.75rem;color:#4a5568;line-height:1.5}
.spinner{width:24px;height:24px;border:2.5px solid rgba(225,48,108,.2);border-top-color:#e1306c;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.vtip{background:#fff;border:1.5px solid #eef0f6;border-radius:16px;overflow:hidden;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.vtip-head{padding:13px 16px;display:flex;align-items:center;gap:10px;background:#fafbff}
.vtip-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,rgba(131,58,180,.1),rgba(225,48,108,.1));display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.vtip-meta .tip-n{font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a0aec0}
.vtip-meta .tip-title{font-size:.86rem;font-weight:700;color:#1a1a2e}
.vtip-body{padding:0 16px 16px;font-size:.78rem;color:#718096;line-height:1.68;border-top:1px solid #eef0f6;padding-top:12px}

.build-field{background:#fff;border:1.5px solid #e8ecf4;border-radius:14px;padding:16px;margin-bottom:11px}

.build-input{width:100%;padding:11px 13px;border:1.5px solid #e8ecf4;border-radius:10px;background:#f7f8fc;color:#1a1a2e;font-family:inherit;font-size:.8rem;outline:none;transition:.15s;box-sizing:border-box}

.build-actions{display:flex;gap:10px;padding:18px 0 32px}
.build-btn{flex:1;border:none;border-radius:50px;padding:14px;font-family:inherit;font-size:.85rem;font-weight:700;transition:.15s;cursor:pointer}
.build-btn-primary{background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff}
.build-btn-secondary{background:#f7f8fc;color:#1a1a2e;border:1.5px solid #e8ecf4}
.yb-hero{background:linear-gradient(135deg,#0f0c29,#302b63);border-radius:20px;padding:28px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.yb-hero-tag{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:50px;margin-bottom:10px}
.yb-hero h2{font-size:1.4rem;font-weight:900;color:#fff;margin-bottom:5px}
.yb-hero p{font-size:.78rem;color:rgba(255,255,255,.6);line-height:1.5}
.yb-section{margin-bottom:20px}
.yb-section-title{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#a0aec0;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.yb-card{background:#fff;border:1.5px solid #e8ecf4;border-radius:14px;padding:14px 16px;margin-bottom:8px}
.yb-card-label{font-size:.68rem;font-weight:700;color:#e1306c;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.yb-card-value{font-size:.82rem;color:#1a1a2e;line-height:1.65;white-space:pre-wrap}
.yb-card-empty{font-size:.78rem;color:#cbd5e1;font-style:italic}
.yb-copy-all{position:sticky;bottom:0;background:linear-gradient(to top,#f7f8fc 60%,transparent);padding:16px 0 8px;margin-top:8px}
.yb-copy-btn{width:100%;background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff;border:none;border-radius:50px;padding:14px;font-family:inherit;font-size:.86rem;font-weight:700;cursor:pointer}
/* CHECKIN */
.checkin-screen-inner{padding:24px 16px 40px}
.checkin-hero{border-radius:20px;padding:32px 22px;margin-bottom:24px;text-align:center;position:relative;overflow:hidden}
.checkin-congrats{font-size:2.2rem;margin-bottom:10px}
.checkin-hero h2{font-size:1.3rem;font-weight:900;color:#fff;margin-bottom:6px}
.checkin-hero p{font-size:.82rem;color:rgba(255,255,255,.82);line-height:1.5}
.checkin-q-label{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a0aec0;margin-bottom:12px}

.checkin-reflection textarea{width:100%;border:1.5px solid #e8ecf4;border-radius:10px;padding:10px 13px;font-family:inherit;font-size:.8rem;color:#1a1a2e;background:#f7f8fc;resize:none;outline:none;min-height:70px;box-sizing:border-box;line-height:1.55}
.next-module-preview{background:rgba(225,48,108,.05);border:1.5px solid rgba(225,48,108,.15);border-radius:16px;padding:18px;margin-bottom:20px}
.nmp-label{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#e1306c;margin-bottom:8px}
.nmp-title{font-size:1rem;font-weight:800;color:#1a1a2e;margin-bottom:4px}
.nmp-desc{font-size:.78rem;color:#718096;line-height:1.5}
.checkin-cta{width:100%;background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff;border:none;border-radius:50px;padding:14px;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;margin-bottom:8px;display:block}
/* SKILLS */
.skills-inner-wrap{padding:18px 16px 32px}
.skills-topbar-title{font-size:1.4rem;font-weight:900;color:#1a1a2e;letter-spacing:-.4px;margin-bottom:4px}
.skills-topbar-sub{font-size:.78rem;color:#718096;margin-bottom:24px}
.skills-section-title{font-size:.64rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a0aec0;margin-bottom:12px}
.skills-course-card{background:linear-gradient(135deg,#833ab4 0%,#e1306c 55%,#fd7b33 100%);border-radius:20px;padding:22px 20px;margin-bottom:20px;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 10px 32px rgba(131,58,180,.3);transition:.15s}
.skills-course-card:active{transform:scale(.98)}
.skills-course-tag{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:50px;margin-bottom:10px}
.skills-course-title{font-size:1.15rem;font-weight:900;color:#fff;margin-bottom:5px}
.skills-course-sub{font-size:.76rem;color:rgba(255,255,255,.75);margin-bottom:14px}
.skills-course-progress{background:rgba(255,255,255,.15);border-radius:50px;height:5px;overflow:hidden;margin-bottom:6px}
.skills-course-bar{height:100%;background:rgba(255,255,255,.9);border-radius:50px;transition:width .4s}
.skills-course-pct{font-size:.64rem;color:rgba(255,255,255,.6)}
.skills-toolkit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.skills-toolkit-card{background:#fff;border:1.5px solid #e8ecf4;border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:.15s}
.skills-toolkit-card:active{transform:scale(.95)}
.skills-toolkit-icon{font-size:1.5rem;margin-bottom:6px}
.skills-toolkit-name{font-size:.65rem;font-weight:700;color:#1a1a2e}
.skills-build-card{background:#fff;border:1.5px solid #e8ecf4;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:.15s}
.skills-build-card:active{transform:scale(.98)}
.skills-build-icon{width:42px;height:42px;flex-shrink:0;background:rgba(225,48,108,.08);border:1.5px solid rgba(225,48,108,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.skills-build-body{flex:1}
.skills-build-title{font-size:.88rem;font-weight:700;color:#1a1a2e;margin-bottom:2px}
.skills-build-sub{font-size:.72rem;color:#a0aec0}
/* MUSE */
.nav-muse .nav-icon{font-size:1.35rem;display:inline-block;animation:museSpinAlive 6s linear infinite;filter:drop-shadow(0 0 6px rgba(168,85,247,.7))}
.nav-muse.active .nav-icon{animation:museSpinAlive 3s linear infinite}
@keyframes museSpinAlive{0%{transform:rotate(0deg) scale(1)}25%{transform:rotate(90deg) scale(1.1)}50%{transform:rotate(180deg) scale(1)}75%{transform:rotate(270deg) scale(1.12)}100%{transform:rotate(360deg) scale(1)}}
.muse-spark{position:absolute;pointer-events:none;font-size:.4rem;font-style:normal;color:#e1306c;opacity:0;z-index:10}
.muse-spark-1{top:0;right:4px;animation:spark_fly1 2.2s ease-in-out infinite}
.muse-spark-2{top:2px;left:3px;color:#a855f7;animation:spark_fly2 2.2s .4s ease-in-out infinite}
.muse-spark-3{top:-2px;right:10px;color:#fd7b33;font-size:.3rem;animation:spark_fly3 2.2s .8s ease-in-out infinite}
.muse-spark-4{top:1px;left:8px;color:#e1306c;font-size:.35rem;animation:spark_fly4 2.2s 1.2s ease-in-out infinite}
.muse-spark-5{top:3px;right:2px;color:#c084fc;font-size:.28rem;animation:spark_fly5 2.2s 1.6s ease-in-out infinite}
@keyframes spark_fly1{0%,100%{opacity:0;transform:translate(0,0) scale(.3)}30%{opacity:1;transform:translate(4px,-6px) scale(1)}80%{opacity:0;transform:translate(7px,-13px) scale(.2)}}
@keyframes spark_fly2{0%,100%{opacity:0;transform:translate(0,0) scale(.3)}30%{opacity:.9;transform:translate(-5px,-7px) scale(1)}80%{opacity:0;transform:translate(-8px,-14px) scale(.2)}}
@keyframes spark_fly3{0%,100%{opacity:0;transform:translate(0,0) scale(.3)}30%{opacity:.8;transform:translate(3px,-5px) scale(1)}80%{opacity:0;transform:translate(5px,-12px) scale(.1)}}
@keyframes spark_fly4{0%,100%{opacity:0;transform:translate(0,0) scale(.3)}30%{opacity:.7;transform:translate(-3px,-6px) scale(.9)}80%{opacity:0;transform:translate(-6px,-13px) scale(.1)}}
@keyframes spark_fly5{0%,100%{opacity:0;transform:translate(0,0) scale(.3)}30%{opacity:1;transform:translate(2px,-5px) scale(1)}80%{opacity:0;transform:translate(4px,-12px) scale(.2)}}
.muse-locked-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 120px;text-align:center;background:#f7f8fc}
.muse-orb{margin:0 auto 28px;position:relative;width:100px;height:100px;animation:orbFloat 3s ease-in-out infinite}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.muse-orb-emoji{font-size:4rem;line-height:1;display:block;animation:orbPulse 2.5s ease-in-out infinite}
@keyframes orbPulse{0%,100%{filter:drop-shadow(0 0 12px rgba(168,85,247,.5))}50%{filter:drop-shadow(0 0 24px rgba(168,85,247,.8))}}
.muse-ring{position:absolute;border-radius:50%;border:1px solid rgba(168,85,247,.25);animation:museRingPulse 3s ease-in-out infinite;inset:-12px}
.muse-ring-2{inset:-26px;border-color:rgba(225,48,108,.15);animation-delay:.8s}
.muse-ring-3{inset:-42px;border-color:rgba(131,58,180,.12);animation-delay:1.6s}
@keyframes museRingPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.04)}}
.muse-locked-title{font-size:1.7rem;font-weight:900;color:#1a1a2e;letter-spacing:-.4px;line-height:1.15;margin-bottom:8px}
.muse-locked-title span{background:linear-gradient(135deg,#a855f7,#e1306c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.muse-locked-sub{font-size:.84rem;color:#718096;line-height:1.65;margin-bottom:32px;max-width:280px}
.muse-previews{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.muse-preview-bubble{background:#fff;border:1.5px solid #e8ecf4;border-radius:18px;padding:14px 16px;text-align:left;position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.muse-preview-bubble::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,transparent 40%,rgba(247,248,252,.95) 100%)}
.muse-preview-label{font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a855f7;margin-bottom:5px}
.muse-preview-text{font-size:.82rem;color:#4a5568;line-height:1.5;filter:blur(.8px);opacity:.7;user-select:none}
.muse-unlock-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.2);border-radius:50px;padding:8px 18px;font-size:.74rem;font-weight:700;color:#833ab4;margin-bottom:20px}
.muse-progress-hint{font-size:.76rem;color:#a0aec0;line-height:1.5;max-width:240px}
.muse-progress-hint strong{color:#833ab4}
.muse-list-wrap{background:#fff;min-height:100vh;display:flex;flex-direction:column}
.muse-list-header{background:#fff;border-bottom:1px solid #f0f0f0;padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.muse-list-title{font-size:1.3rem;font-weight:900;color:#1a1a2e}
.muse-list-title span{background:linear-gradient(135deg,#833ab4,#e1306c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.muse-new-btn{width:36px;height:36px;background:linear-gradient(135deg,#833ab4,#e1306c);border:none;border-radius:50%;color:#fff;font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.muse-conv-item{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;border-bottom:1px solid #f8f8f8}
.muse-conv-orb{width:44px;height:44px;flex-shrink:0;background:linear-gradient(135deg,#833ab4,#e1306c);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.muse-conv-body{flex:1;min-width:0}
.muse-conv-title{font-size:.88rem;font-weight:700;color:#1a1a2e;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muse-conv-preview{font-size:.76rem;color:#a0aec0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muse-conv-time{font-size:.64rem;color:#cbd5e1;flex-shrink:0}
.muse-empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.muse-empty-title{font-size:1rem;font-weight:800;color:#1a1a2e;margin-bottom:6px}
.muse-empty-sub{font-size:.8rem;color:#a0aec0;line-height:1.6;margin-bottom:20px;max-width:240px}
.muse-start-btn{background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff;border:none;border-radius:50px;padding:13px 28px;font-family:inherit;font-size:.86rem;font-weight:700;cursor:pointer}
#muse-chat-screen{background:#fff}
.muse-chat-wrap{display:flex;flex-direction:column;height:100%;background:#fff}
.muse-chat-messages{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}
.muse-chat-messages::-webkit-scrollbar{width:0}
.msg-row{display:flex;align-items:flex-end;gap:8px;animation:msgFloat .4s cubic-bezier(.34,1.3,.64,1) both}
@keyframes msgFloat{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg-row.user{justify-content:flex-end}
.msg-row.muse-msg{justify-content:flex-start}
.msg-avatar{width:28px;height:28px;flex-shrink:0;background:linear-gradient(135deg,#833ab4,#e1306c);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.msg-bubble{max-width:78%;padding:11px 15px;border-radius:20px;font-size:.84rem;line-height:1.65;word-break:break-word}
.msg-row.user .msg-bubble{background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff;border-bottom-right-radius:5px}
.msg-row.muse-msg .msg-bubble{background:#f4f4f8;color:#1a1a2e;border-bottom-left-radius:5px}
.typing-indicator{display:flex;align-items:center;gap:8px;padding:4px 0}
.typing-dots{background:#f4f4f8;border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:5px}
.typing-dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#833ab4,#e1306c);animation:typingBubble 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingBubble{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.muse-chat-input-wrap{padding:10px 14px 16px;background:#fff;border-top:1px solid #f0f0f0;display:flex;align-items:flex-end;gap:10px}
.muse-chat-input{flex:1;background:#f4f4f8;border:none;outline:none;border-radius:22px;padding:11px 16px;font-family:inherit;font-size:.86rem;color:#1a1a2e;resize:none;max-height:120px;line-height:1.5}
.muse-send-btn{width:42px;height:42px;flex-shrink:0;background:#e8e8f0;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;font-size:1rem}
.muse-send-btn.active{background:linear-gradient(135deg,#833ab4,#e1306c);box-shadow:0 4px 14px rgba(131,58,180,.4);transform:scale(1.08)}
.muse-watermark{text-align:center;padding:4px 0 2px;font-size:.62rem;color:#e0e0e8}
/* TODAY */
.today-card{background:#fff;border:1.5px solid #e8ecf4;border-radius:20px;margin-bottom:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.today-card-header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}

.today-headline{font-size:1rem;font-weight:800;color:#1a1a2e;line-height:1.3;margin-bottom:8px}

.today-action-box{background:rgba(225,48,108,.05);border:1.5px solid rgba(225,48,108,.15);border-radius:12px;padding:12px 14px}
.today-action-label{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#e1306c;margin-bottom:4px}
.today-action-text{font-size:.8rem;color:#4a5568;line-height:1.55}
/* STREAK */
.streak-bar{background:#fff;border:1.5px solid #e8ecf4;border-radius:16px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.06)}

+'<div class="mcard"><div class="mcard-label">Section 1</div><div class="mcard-title">Your Introduction</div><div class="mcard-body">Name and handle. Your niche in one sentence. Your audience in one sentence.<br/><br/>Example: I am Amara, a lifestyle creator in Dar es Salaam creating content about affordable healthy living for everyday Tanzanians. My audience is primarily women aged 18-35.</div><div class="mcard-tip">Local relevance is your competitive advantage over international creators.</div></div>'
+'<div class="mcard"><div class="mcard-label">Section 2</div><div class="mcard-title">Your Numbers</div><div class="mcard-body">Total followers. Monthly reach. Average engagement rate (likes + comments divided by followers times 100). Average views per Reel. Best performing post stats. Update every month.</div><div class="mcard-tip">10% engagement with 2,000 followers is worth more than 1% with 20,000.</div></div>'
+'<div class="mcard"><div class="mcard-label">Section 3</div><div class="mcard-title">Services and Rates</div><div class="mcard-body">Instagram Reel — your price<br/>Instagram Story (3 slides) — your price<br/>Static post — your price<br/>UGC content (raw file, no posting) — your price<br/>Content package — bundled price</div></div>'
+'</div>'
+'<div class="mpanel" id="mpanel-captions">'
+'<div class="mcard"><div class="mcard-label">Formula 01</div><div class="mcard-title">Hook — Story — CTA</div><div class="mcard-body mcard-mono">HOOK: Grab attention in 1-2 lines\n\nSTORY: 2-3 sentences of context or the problem\n\nVALUE: The main point or takeaway\n\nCTA: One clear action — save this, comment below, follow for more</div><div class="mcard-tip">If the first line does not stop them, they will never read the rest.</div></div>'
+'<div class="mcard"><div class="mcard-label">Formula 02</div><div class="mcard-title">The List Caption</div><div class="mcard-body">Bold statement. Then 3-5 numbered points. End with a save CTA. List captions get saved 3x more than paragraph captions.</div><div class="mcard-tip">Example: 5 things I stopped doing that doubled my engagement — then list them. Save this — you will need it.</div></div>'
+'<div class="mcard"><div class="mcard-label">Hashtag Strategy</div><div class="mcard-title">5 to 10 Hashtags Maximum</div><div class="mcard-body">2 large (1M+ posts) for reach<br/>3 medium (100K-500K posts) for discoverability<br/>3 small niche (under 50K posts) for ranking<br/>1-2 location hashtags<br/><br/>Put hashtags in the caption — not the comments.</div><div class="mcard-tip">Instagram confirmed captions get better reach than comments.</div></div>'
+'</div></div>';
