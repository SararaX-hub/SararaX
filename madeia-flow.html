function _onBuildInput(fid){
  var el=document.getElementById('field-'+fid);if(!el)return;
  crs_saveBuildField(fid,el.value);
  var check=document.getElementById('check-'+fid);
  var filled=el.value.trim().length>0;
  if(check){check.classList.toggle('filled',filled);check.textContent=filled?'✓':'';}
  var tick=document.getElementById('tick-'+fid);
  if(tick){tick.classList.add('show');clearTimeout(_buildSaveTimers[fid]);_buildSaveTimers[fid]=setTimeout(function(){tick.classList.remove('show');},1500);}
  var pill=document.getElementById('build-pill');
  var bar=document.getElementById('build-bar');
  if(pill){
    var mi=null;BUILD_FIELDS.forEach(function(b){b.fields.forEach(function(f){if(f.id===fid)mi=b.mod;});});
    if(mi!==null){
      var bf=crs_buildFieldsFilledCount(mi);
      pill.textContent='📝 '+bf.filled+' of '+bf.total+' fields filled';
      if(bar&&bf.total>0)bar.style.width=Math.round((bf.filled/bf.total)*100)+'%';
    }
  }
  var tf=0,tt=0;BUILD_FIELDS.forEach(function(b){tt+=b.fields.length;b.fields.forEach(function(f){if(crs_getBuildField(f.id).trim())tf++;});});
  if(tf===tt&&!window._buildCompleteFired){window._buildCompleteFired=true;setTimeout(_showBuildComplete,600);}
}

function _recalcBuildProgress(){
  var pill=document.getElementById('build-pill');var bar=document.getElementById('build-bar');
  if(!pill||!bar)return;
  var mi=null;
  BUILD_FIELDS.forEach(function(b){b.fields.forEach(function(f){var el=document.getElementById('field-'+f.id);if(el){var val=el.value;if(val!==crs_getBuildField(f.id)){crs_saveBuildField(f.id,val);var check=document.getElementById('check-'+f.id);var filled=val.trim().length>0;if(check){check.classList.toggle('filled',filled);check.textContent=filled?'✓':'';}}mi=b.mod;}});});
  if(mi===null)return;
  var bf=crs_buildFieldsFilledCount(mi);
  pill.textContent='📝 '+bf.filled+' of '+bf.total+' fields filled';
  if(bf.total>0)bar.style.width=Math.round((bf.filled/bf.total)*100)+'%';
  var tf=0,tt=0;BUILD_FIELDS.forEach(function(b){tt+=b.fields.length;b.fields.forEach(function(f){if(crs_getBuildField(f.id).trim())tf++;});});
  if(tf===tt&&!window._buildCompleteFired){window._buildCompleteFired=true;setTimeout(_showBuildComplete,800);}
}

function _copyYourBuild(){
  var lines=['MY CREATOR BUSINESS PLAN — Madeia Flow CIS',''];
  BUILD_FIELDS.forEach(function(b){
    var hasAny=b.fields.some(function(fi){return crs_getBuildField(fi.id).trim();});

    lines.push('');lines.push('── '+b.modTitle.toUpperCase()+' ──');

  });
  var text=lines.join('\n');

  var fail=function(){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){_showCopyToast('Try long-pressing');}document.body.removeChild(ta);};

}

async function _museSend(){
  var inp=document.getElementById('muse-input');if(!inp||!inp.value.trim())return;
  var text=inp.value.trim();inp.value='';inp.style.height='auto';
  document.getElementById('muse-send').classList.remove('active');

  conv.messages.push({role:'user',content:text});
  if(conv.title==='New conversation'&&text.length>3)conv.title=text.substring(0,40)+(text.length>40?'...':'');
  conv.updated=Date.now();if(conv.messages.length>50)conv.messages=conv.messages.slice(-50);
  _saveConvs();
  var msgs=document.getElementById('muse-messages');

  if(msgs){msgs.appendChild(td);msgs.scrollTop=msgs.scrollHeight;}
  try{

    if(!apiKey){showKeyModal(function(key){sessionStorage.setItem('mf_api_key',key);});var t=document.getElementById('muse-typing');if(t)t.remove();return;}
    var apiMsgs=[{role:'user',content:_museSystemPrompt()}].concat(conv.messages.slice(-20).map(function(m){return {role:m.role==='user'?'user':'assistant',content:m.content};}));
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:apiMsgs})});
    var data=await res.json();if(data.error)throw new Error(data.error.message);
    var reply=data.content.map(function(b){return b.text||'';}).join('');
    var t2=document.getElementById('muse-typing');if(t2)t2.remove();
    conv.messages.push({role:'assistant',content:reply});conv.updated=Date.now();_saveConvs();
    if(msgs){var rd=document.createElement('div');rd.className='msg-row muse-msg';rd.innerHTML='<div class="msg-avatar">🔮</div><div class="msg-bubble">'+(reply.split('\n').join('<br/>'))+'</div>';msgs.appendChild(rd);msgs.scrollTop=msgs.scrollHeight;}

    setTopBar(conv.title,true);

}

/* ── STREAK ── */
function _getStreak(){try{var d=JSON.parse(localStorage.getItem('mf_streak')||'{}');return {count:d.count||0,best:d.best||0,last:d.last||null,days:d.days||[]};}catch(e){return {count:0,best:0,last:null,days:[]};} }

function _saveStreak(s){try{localStorage.setItem('mf_streak',JSON.stringify(s));}catch(e){}}
function _todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function _yesterdayStr(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function _updateStreak(){
  var s=_getStreak();var today=_todayStr();
  if(s.last===today)return s;
  if(s.last===_yesterdayStr()){s.count++;}else if(s.last===null){s.count=1;}else{s.count=1;}
  if(s.count>s.best)s.best=s.count;
  s.last=today;if(!s.days)s.days=[];if(s.days.indexOf(today)===-1)s.days.push(today);
  if(s.days.length>30)s.days=s.days.slice(-30);
  _saveStreak(s);return s;
}
function _getLast7Days(){var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));}return days;}
function _getDayShort(dateStr){var d=new Date(dateStr+'T12:00:00');return ['S','M','T','W','T','F','S'][d.getDay()];}

function _renderStreak(){
  var wrap=document.getElementById('streak-wrap');if(!wrap)return;
  var s=_updateStreak();var last7=_getLast7Days();var today=_todayStr();
  var html='<div class="streak-bar"><div class="streak-left"><div class="streak-flame">'+(s.count>=7?'🔥':s.count>=3?'⚡':'✦')+'</div><div><div class="streak-count">'+s.count+'</div><div class="streak-label">day streak</div></div></div>';
  html+='<div style="text-align:right">';
  if(s.best>0)html+='<div class="streak-best">Best: <span>'+s.best+' days</span></div>';
  html+='</div></div>';
  html+='<div style="display:flex;gap:4px;margin-bottom:16px;padding:0 2px">';
  last7.forEach(function(dayStr){
    var visited=s.days&&s.days.indexOf(dayStr)>-1;var isToday=dayStr===today;
    var cls='streak-day'+(isToday?' today':visited?' active':'');
    html+='<div style="flex:1;text-align:center"><div style="font-size:.55rem;color:#a0aec0;font-weight:600;margin-bottom:4px">'+_getDayShort(dayStr)+'</div><div class="'+cls+'"></div></div>';
  });
  html+='</div>';
  wrap.innerHTML=html;
}

    sessionStorage.setItem('mf_unlocked','1');
    var gate=document.getElementById('password-gate');
    var content=document.getElementById('members-content');
    if(gate)gate.style.display='none';
    if(content)content.style.display='block';
    var err=document.getElementById('pw-error');if(err)err.style.display='none';
  }else{
    var err=document.getElementById('pw-error');
    if(err)err.style.display='block';
    if(inp){inp.value='';inp.focus();}
  }
}
</script>
